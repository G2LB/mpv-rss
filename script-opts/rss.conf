# rss.lua options -- copy to <mpv config dir>/script-opts/rss.conf, i.e.
#   Windows            %APPDATA%\mpv\script-opts\rss.conf
#   Linux / BSD        ~/.config/mpv/script-opts/rss.conf
#   macOS              ~/.config/mpv/script-opts/rss.conf
#
# Every line below shows the DEFAULT and is commented out, so the script works
# with this file absent. Uncomment a line to change it.
# Booleans are yes/no. No quotes around values, no spaces around "=".
# Anything here can also be set on the command line, e.g.
#   mpv --script-opts=rss-font_size=13,rss-date_format=relative

# ---------------------------------------------------------------- keybinding
# Key that opens/closes the browser. Any mpv key name: ctrl+r, F9, i, MBTN_MID…
#key_open=ctrl+r

# Open the browser automatically on startup (mpv-rss.cmd sets this itself).
#auto_open=no

# In-menu keys. These are bound only while the browser is open and removed the
# moment it closes, so they never permanently override an mpv default.
# Collisions while the menu is open: p normally pauses (Space still does), and
# i normally shows stats (Shift+I still does). n is unbound in mpv by default.
#key_queue=p          # add the selected video to the end of the playlist
#key_play_next=n      # insert it right after the current video
#key_index=i          # show the playlist, numbered
#key_edit=alt+a       # open rss-feeds.json in an editor

# Command used by key_edit. "auto" picks per platform:
#   Windows      nvim in Windows Terminal, else nvim in a console window
#   macOS        open -t  (the registered plain-text editor)
#   Linux / BSD  $VISUAL or $EDITOR -- or, with neither set, the first of
#                nvim, vim, nano, vi that is installed -- inside the first terminal
#                emulator that is installed -- x-terminal-emulator, kitty,
#                alacritty, wezterm, foot, gnome-terminal, konsole, xterm --
#                falling back to xdg-open
# Override with any command: the file path is appended, or put {} where it
# belongs. Words are split on whitespace, and there is no quoting.
#   editor=code -w          editor=notepad          editor=gedit
#   editor=kitty nvim       editor=x-terminal-emulator -e vim
#editor=auto

# -------------------------------------------------------------------- feeds
# Feeds older than this many seconds are refreshed when the browser opens.
# 1800 = 30 minutes. There is no background polling; only this and the r key.
#refresh_interval=1800

# Refresh stale feeds when the browser opens. Set to no to only ever refresh
# manually with r.
#refresh_on_open=yes

# Entries kept per feed, and total entries in the merged "All Videos" list.
#max_entries_per_feed=50
#max_total_entries=300

# How many feeds are downloaded at the same time.
#max_parallel=4

# Ignore YouTube Shorts. A channel feed holds only 15 items and mixes Shorts in
# with real uploads, so a channel that posts clips can push every actual video
# out of it. With this on, a channel feed is fetched through the channel's
# long-form uploads playlist (the same list, built by YouTube without Shorts)
# and anything that still looks like a Short -- a /shorts/ link, a #shorts
# title -- is dropped. rss-feeds.json is not rewritten: set this to no and you
# are back to the feed exactly as listed. A channel with no long-form videos at
# all falls back to its plain channel feed.
#skip_shorts=yes

# Fetch a channel's live streams as well. This only matters with skip_shorts
# on, and it is there to undo a side effect of it: the long-form playlist that
# option switches to holds no streams at all, so a channel that mostly goes
# live would show nothing it had actually posted. Streams -- live now and
# finished alike -- sit in their own UULV playlist, fetched alongside the
# long-form one and merged by date. Costs one extra request per channel feed.
#include_live=yes

# ----------------------------------------------------------------------- UI
# Maximum items per page. The panel never draws more than actually fit in the
# window, so to see MORE items, lower font_size. Every row is one line.
#visible_rows=20

# Panel width as a fraction of the window.
#ui_width=0.86

# Virtual canvas height. Font sizes below are in these units, and the whole
# panel is scaled to the window, so the UI looks the same at any resolution.
#osd_height=720

# Body text size in canvas units. Everything else -- heading, icons, metadata
# and key hints -- is derived from it, so this one number scales the whole
# interface. 18 fits ~13 rows at 16:9; 14 fits ~17.
#font_size=18

# Size of the list rows, as a fraction of font_size. The header card carries
# all the detail, so a row is a single line and can afford to be bigger than
# the rest of the interface. 1.0 makes it the same size as everything else.
#list_size=1.2

# Font family. Empty = auto-detect an installed Nerd Font, else mpv's OSD font.
# NOTE the family name differs per platform: the Windows installer registers
# "JetBrainsMono NF", while fontconfig on Linux and macOS reports
# "JetBrainsMono Nerd Font". The wrong name renders every icon as a blank box,
# so leave this empty unless auto-detection misses -- it knows both spellings.
# Auto-detection asks the OS: PowerShell on Windows, fc-list on Linux and the
# BSDs, fc-list then system_profiler on macOS. Where none of those answer the
# icons stay ASCII; set icons=nerd and font=<family> to force them on.
#font=

# auto  = use Nerd Font icons when one is installed, otherwise ASCII
# nerd  = always use Nerd Font icons
# ascii = never use them
#icons=auto

# Fraction of the window height kept free at the bottom so the panel never
# covers mpv's own on-screen controller. The OSC also publishes what it
# reserves; the larger of the two wins.
#osc_reserve=0.10

# Brief title card (title, channel, duration) at the top left when a feed item
# starts playing.
#title_overlay=yes
#title_overlay_seconds=2.5

# While the browser is open, hold the last frame when a video reaches its end
# instead of letting it unload, so the picture does not drop out from under you
# while you are still browsing. This borrows mpv's own keep-open and restores
# whatever you had set as soon as the browser closes.
#keep_open_in_menu=yes

# Commit playback progress to disk every N seconds while something is playing,
# so an abrupt exit (a crash, a kill, pulling the power) costs at most this much
# instead of the whole session. 0 turns it off; progress is still written when a
# file ends and when mpv shuts down normally.
#autosave_interval=60

# Show the selected item's description as a fourth line of the header card.
#show_descriptions=no

# ------------------------------------------------------------ small windows
# Everything above is in virtual canvas units, so a small mpv window does not
# get a cramped panel -- it gets the same panel in miniature, three tab columns
# and all, with the titles squeezed into a sliver of it. Below the thresholds
# the browser switches to a single-column layout instead:
#
#   2/3  VIDEOS   New 45                                            3 / 45
#   󰀄 Historia Civilis · Oct 17 · 24:00
#   The Assassination of Julius Caesar (44 B.C.E.)
#   ● new
#   --------------------------------------------------------------------
#   ▶ ● Oct 17 | The Assassination of Julius Caesar (44 B.C.E.)
#
# one section at a time (Tab cycles, 1-3 pick one outright) and larger text.
#
# auto = decide from the window size (below) | always | never
#narrow_layout=auto

# Window width in pixels at or below which the narrow layout is used. 0 = off.
#narrow_width=960

# ...or this fraction of the width of the display mpv is on, which is what
# catches a window that is small only relative to a large screen. 0 = off.
# Fullscreen is therefore always the wide layout. Set both to 0 and only
# narrow_layout=always has any effect.
#narrow_ratio=0.6

# How much larger the text is in the narrow layout. This works by shrinking
# the virtual canvas, so font_size covers more of the window; the number of
# rows on a page follows automatically.
#narrow_scale=1.2

# Markers for the three watch states. Unseen items are white, partially seen
# ones blue (with their resume position), finished ones grey.
#unread_marker=●
#partial_marker=◐
#seen_marker=✓

# Number the rows of the video list too. (The playlist view, opened with the
# index key, is always numbered regardless of this.)
#show_index=no

# The permanent key-hint bar along the bottom. Off by default -- "?" shows the
# full list on demand, so the row is mostly wasted space. Filter input, the
# delete confirmation, status messages and the error view's "r retry" still
# appear at the bottom when they are relevant.
#footer_hints=no

# How a date is written, in the list and in the header card.
#   short     "Aug 06"              fixed width, so the titles line up
#   relative  "3 days ago"
#   absolute  "2026-09-29 14:03"
#date_format=short

# Superseded by date_format. Still honoured when that is left at short, so an
# older config saying relative_dates=no still gets spelled-out dates.
#relative_dates=yes

# ----------------------------------------------------------------- behaviour
# Watch state is normally derived from how much you actually played: an item
# becomes "partially seen" past min_progress_seconds, and "seen" once you pass
# watched_threshold of its duration or it plays to the end.
# Set this to yes for the blunt old behaviour, where pressing Enter marks an
# item seen immediately (which means nothing is ever shown as partially seen).
#mark_watched_on_play=no

# Start with finished items hidden from the lists. "v" toggles it while running,
# and the heading then reads "unwatched only".
#hide_watched=yes
#watched_threshold=0.9
#min_progress_seconds=15

# --------------------------------------------------------------- thumbnails
# Artwork for the highlighted item, drawn beside the list: a YouTube video
# thumbnail, a per-episode podcast image (itunes:image / podcast:images /
# podcast:artwork), or else the show artwork of the feed.
# mpv's Lua cannot decode PNG/JPEG, so ffmpeg converts the image to raw pixels
# and overlay-add puts it on screen. Without ffmpeg on PATH this is simply off.
#thumbnails=yes

# Shape of the preview, width / height. 1.78 is 16:9, which a YouTube thumbnail
# fills exactly; squarer artwork is scaled to cover and centre-cropped, so
# the frame is never left with empty space inside it.
#
# There is deliberately no size setting. The preview is exactly as tall as the
# header band, so that it sits on the rule closing that band instead of ending
# somewhere above it. To make it bigger, raise font_size: a taller card means a
# taller band means a bigger preview. (thumbnail_size and narrow_thumb are gone
# for this reason; leaving them in this file is harmless, mpv just notes that
# it does not know them.)
#thumbnail_aspect=1.78

# Some servers refuse a TLS handshake with mpv's bundled ffmpeg even though
# curl connects fine (bitsoffreedom.nl is one). When direct playback of a
# podcast enclosure fails, the episode is fetched once and played from disk.
#download_fallback=yes

# ---------------------------------------------------------------------- http
# auto = use curl if present (it ships with Windows 10 1803+ and with every
# current Linux and macOS), otherwise PowerShell's Invoke-WebRequest on
# Windows and wget everywhere else. Force one with: curl | wget | powershell
# (powershell outside Windows falls back to wget).
#http_backend=auto

# Seconds before a feed download is given up on. This is a budget for a few
# kilobytes of XML and is NOT applied to a podcast episode fetched by
# download_fallback: an episode runs to tens of megabytes, so an overall
# deadline would just kill it partway on a slower connection. Those are capped
# on the handshake instead, and given up on only once the transfer has stalled
# (under 1 kB/s for 30 s).
#http_timeout=20

# --------------------------------------------------------------------- paths
# Empty = <mpv config dir>/rss-feeds.json etc. mpv path syntax works here,
# e.g. ~~/subdir/rss-feeds.json  (~~/ is the mpv config directory).
#feeds_file=
#cache_file=
#state_file=

# ----------------------------------------------------------- troubleshooting
# Parse one feed file or URL at startup and log what the parser saw. Use with
#   mpv --msg-level=rss=debug --script-opts=rss-debug_parse=C:\path\feed.xml
#debug_parse=
